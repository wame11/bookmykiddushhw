<!DOCTYPE html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Book my Kiddush</title>
<meta name="robots" content="noindex">
<script>
  // bookmykiddush.co.uk and bookmykiddush.com land here (GoDaddy forwards them).
  // People who clicked a link on a Hadley Wood website go straight to the Hadley Wood booking page;
  // everyone else goes to the Book my Kiddush front page at bookmykiddush.uk.
  (function () {
    var host = "";
    try { host = new URL(document.referrer).hostname.toLowerCase(); } catch (e) {}
    var fromHadleyWood = /(^|\.)hwjc\.(uk|org\.uk)$/.test(host);
    window.location.replace(fromHadleyWood ? "https://hwjc.uk/book-my-kiddush" : "https://bookmykiddush.uk/");
  })();
</script>
<noscript><meta http-equiv="refresh" content="0; url=https://bookmykiddush.uk/"></noscript>
<style>
  body { margin: 0; min-height: 100vh; display: grid; place-items: center; font-family: system-ui, -apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; color: #26292b; background: #f6f4ef; }
  p { text-align: center; padding: 1rem; font-size: 1.2rem; }
</style>
</head>
<body>
  <p>Opening Book my Kiddush&hellip; <a href="https://bookmykiddush.uk/">Continue</a></p>
</body>
</html>
